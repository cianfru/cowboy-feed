name: feed

on:
  # Started every 5 minutes by an external cron service; GitHub's own schedule is a backup.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Rebuild the app files even when nothing is due
        type: boolean
        default: false

concurrency:
  group: feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUESTIONS_PUBLISH: "on"
      QUESTIONS_TRADING: ${{ vars.QUESTIONS_TRADING }}
      QUESTIONS_TRADING_MAINNET: ${{ vars.QUESTIONS_TRADING_MAINNET }}
      DERIVE_SNAPSHOT_SOURCES: ${{ vars.DERIVE_SNAPSHOT_SOURCES || 'v3_mainnet' }}
      STORE: ${{ github.workspace }}/store
      SITE: ${{ github.workspace }}/site
    steps:
      - uses: actions/checkout@v4
        with:
          path: feed
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: cianfru/derive_scan
          token: ${{ secrets.CODE_TOKEN }}
          path: code
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: cianfru/derive_scan
          token: ${{ secrets.CODE_TOKEN }}
          ref: data
          path: store
          fetch-depth: 1

      - name: Previous app files
        run: |
          mkdir -p site
          if git -C feed fetch -q --depth 1 origin site-data 2>/dev/null; then
            git -C feed archive FETCH_HEAD | tar -x -C site
          elif git -C code fetch -q --depth 1 origin site-data 2>/dev/null; then
            git -C code archive FETCH_HEAD | tar -x -C site
          fi

      - name: Due?
        id: due
        run: bash code/backend/feed.sh due

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true' || steps.due.outputs.signals_due == 'true' || steps.due.outputs.history_due == 'true' || steps.due.outputs.flow_due == 'true' || inputs.publish
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/backend/requirements*.txt

      - name: Install
        if: steps.due.outputs.due == 'true' || steps.due.outputs.signals_due == 'true' || steps.due.outputs.history_due == 'true' || steps.due.outputs.flow_due == 'true' || inputs.publish
        run: pip install -q -r code/backend/requirements-record.txt

      - name: Run
        id: run
        env:
          DUE: ${{ steps.due.outputs.due }}
          SIGNALS_DUE: ${{ steps.due.outputs.signals_due }}
          HISTORY_DUE: ${{ steps.due.outputs.history_due }}
          FLOW_DUE: ${{ steps.due.outputs.flow_due }}
          FORCE: ${{ inputs.publish }}
        run: bash code/backend/feed.sh run

      # The app reads site-data only; it is replaced with a single commit each run (no history).
      - name: Publish
        if: always() && steps.run.outputs.publish == 'true'
        working-directory: feed
        run: |
          git worktree add -q --orphan -b site-out ../site-out
          cp -r ../site/. ../site-out/
          cd ../site-out
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "app data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin HEAD:site-data
